<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ściąga Linux</title>
<meta name="description" content="Samouczek i ściąga komend dla CachyOS i Linux Mint.">
<meta name="theme-color" content="#eef2f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101615" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Układ: przyklejony pasek narzędzi (szukaj + system), pod nim jedna kolumna sekcji; wiersz komendy = kod po lewej, opis po prawej. */
:root {
  --bg: #eef2f1;
  --surface: #ffffff;
  --ink: #15201e;
  --muted: #56655f;
  --line: #d6dfdb;
  --code-bg: #e6ecea;
  --accent: #1d4f7a;
  --cachy: #0a7f7a;
  --cachy-soft: #d7efed;
  --mint: #4a8a2a;
  --mint-soft: #e2f0d8;
  --warn: #9a5a00;
  --warn-soft: #fbeed6;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", "DejaVu Sans Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101615; --surface: #172020; --ink: #e4ebe8; --muted: #93a39d; --line: #283432;
    --code-bg: #0b100f; --accent: #86b7e6; --cachy: #43cbc2; --cachy-soft: #133331;
    --mint: #94cf6f; --mint-soft: #1d2e16; --warn: #f0b561; --warn-soft: #33260f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101615; --surface: #172020; --ink: #e4ebe8; --muted: #93a39d; --line: #283432;
  --code-bg: #0b100f; --accent: #86b7e6; --cachy: #43cbc2; --cachy-soft: #133331;
  --mint: #94cf6f; --mint-soft: #1d2e16; --warn: #f0b561; --warn-soft: #33260f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.55 var(--f-body);
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; }

/* Nagłówek */
.top { padding-block: 28px 8px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.logo { width: 44px; height: 44px; flex: none; border-radius: 11px; }
.brand { flex: 1 1 220px; min-width: 0; }
.brand h1 { margin: 0; font: 700 1.75rem/1.1 var(--f-display); letter-spacing: -0.02em; text-wrap: balance; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 0.95rem; }
.install {
  border: 1px solid var(--accent); background: transparent; color: var(--accent);
  border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 700;
}
.install:hover { background: var(--accent); color: var(--surface); }

/* Pasek narzędzi */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.bar-in { padding-block: 10px; display: flex; flex-direction: column; gap: 10px; }
.row1 { display: flex; gap: 10px; flex-wrap: wrap; }
.search { position: relative; flex: 1 1 260px; min-width: 0; }
.search input {
  width: 100%; padding: 10px 40px 10px 38px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface);
}
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search kbd {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  font: 0.75rem var(--f-mono); color: var(--muted); border: 1px solid var(--line);
  border-radius: 4px; padding: 0 5px;
}
.seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button {
  border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; cursor: pointer;
  color: var(--muted); font-weight: 700; font-size: 0.9rem; white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg button[data-d="cachy"][aria-pressed="true"] { background: var(--cachy); color: var(--surface); }
.seg button[data-d="mint"][aria-pressed="true"] { background: var(--mint); color: var(--surface); }

.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
.chips a {
  flex: none; text-decoration: none; color: var(--ink); font-size: 0.85rem;
  padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  display: inline-flex; gap: 6px; align-items: center;
}
.chips a:hover { border-color: var(--accent); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.cachy { background: var(--cachy); }
.dot.mint { background: var(--mint); }

/* Sekcje */
main { padding-block: 18px 60px; display: flex; flex-direction: column; gap: 34px; }
section { scroll-margin-top: 140px; }
.sh { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.sh h2 { margin: 0; font: 700 1.35rem/1.2 var(--f-display); letter-spacing: -0.01em; text-wrap: balance; }
.tag {
  font: 700 0.7rem/1 var(--f-body); letter-spacing: 0.08em; text-transform: uppercase;
  padding: 4px 7px; border-radius: 5px; background: var(--code-bg); color: var(--muted);
}
.tag.cachy { background: var(--cachy-soft); color: var(--cachy); }
.tag.mint { background: var(--mint-soft); color: var(--mint); }
.intro { margin: 0 0 12px; color: var(--muted); max-width: 68ch; }

.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.item { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) auto; gap: 8px 16px; padding: 12px 14px; border-top: 1px solid var(--line); align-items: start; }
.item:first-child { border-top: 0; }
.steps .item { grid-template-columns: auto minmax(0, 1.15fr) minmax(0, 1fr) auto; }
.num {
  width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: transparent;
  display: grid; place-items: center; cursor: pointer; font: 700 0.8rem var(--f-mono); color: var(--muted); padding: 0;
}
.item.done .num { background: var(--mint); border-color: var(--mint); color: var(--surface); }
.item.done .cmd, .item.done .desc { opacity: 0.55; }

.cmd { min-width: 0; }
.cmd code {
  display: block; font: 0.86rem/1.5 var(--f-mono); background: var(--code-bg);
  padding: 7px 10px; border-radius: 7px; overflow-x: auto; white-space: pre; cursor: copy;
}
.cmd code::before { content: "$ "; color: var(--muted); user-select: none; }
.gui { font-size: 0.8rem; color: var(--muted); margin-top: 6px; display: flex; gap: 6px; align-items: center; }
.gui.solo { margin-top: 0; }
.gui b { font-weight: 700; color: var(--ink); background: var(--code-bg); padding: 2px 7px; border-radius: 5px; font: 700 0.8rem var(--f-mono); }
.desc { min-width: 0; font-size: 0.95rem; }
.desc p { margin: 0; }
.warn { margin-top: 6px !important; font-size: 0.85rem; background: var(--warn-soft); color: var(--warn); padding: 5px 9px; border-radius: 6px; }
.acts { display: flex; gap: 4px; }
.ic {
  width: 32px; height: 32px; border-radius: 7px; border: 1px solid transparent; background: transparent;
  display: grid; place-items: center; cursor: pointer; color: var(--muted); padding: 0;
}
.ic:hover { border-color: var(--line); color: var(--ink); }
.ic.on { color: var(--warn); }
.ic.ok { color: var(--mint); }

.tbl { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 0.92rem; }
th, td { text-align: left; padding: 9px 14px; border-top: 1px solid var(--line); vertical-align: top; }
thead th { border-top: 0; font: 700 0.75rem var(--f-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
thead th:nth-child(2) { color: var(--cachy); }
thead th:nth-child(3) { color: var(--mint); }
td:first-child { font-weight: 700; }
td.mono { font: 0.84rem/1.5 var(--f-mono); }

.empty { text-align: center; color: var(--muted); padding: 40px 0; }
.empty b { color: var(--ink); }
footer { color: var(--muted); font-size: 0.85rem; padding-block: 0 40px; }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px);
  background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-weight: 700;
  opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 10;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 700px) {
  .item { grid-template-columns: minmax(0, 1fr) auto; }
  .item .desc { grid-column: 1 / 2; }
  .item .acts { grid-row: 1; grid-column: 2; }
  .steps .item { grid-template-columns: auto minmax(0, 1fr) auto; }
  .steps .item .desc { grid-column: 2 / 3; }
  .steps .item .acts { grid-column: 3; }
  .kbd-hint { display: none; }
  .search input { padding-right: 12px; }
  .brand h1 { font-size: 1.5rem; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } html { scroll-behavior: auto; } }
html { scroll-behavior: smooth; }

</style>
</head>
<body>
<div class="wrap top">
  <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#15201e"/><path d="M16 22l12 10-12 10" fill="none" stroke="#43cbc2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="32" y="39" width="17" height="6" rx="3" fill="#94cf6f"/></svg>
  <div class="brand">
    <h1>Ściąga Linux</h1>
    <p>CachyOS i Linux Mint: komendy, ustawienia, pierwsze kroki. Działa offline.</p>
  </div>
  <button class="install" id="installBtn" hidden>Zainstaluj aplikację</button>
</div>

<div class="bar">
  <div class="wrap bar-in">
    <div class="row1">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Szukaj: aktualizacja, wifi, sterowniki…" autocomplete="off" aria-label="Szukaj komendy">
        <kbd class="kbd-hint">/</kbd>
      </label>
      <div class="seg" role="group" aria-label="System">
        <button data-d="all" aria-pressed="true">Wszystko</button>
        <button data-d="cachy" aria-pressed="false">CachyOS</button>
        <button data-d="mint" aria-pressed="false">Mint</button>
        <button data-d="fav" aria-pressed="false">★ Ulubione</button>
      </div>
    </div>
    <nav class="chips" id="chips" aria-label="Sekcje"></nav>
  </div>
</div>

<main class="wrap" id="main"></main>

<footer class="wrap">
  Kliknij komendę, żeby ją skopiować. Gwiazdka dodaje do ulubionych, kółko przy krokach oznacza je jako zrobione. Wszystko zapisuje się tylko na tym urządzeniu.
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

    for (const k in attrs || {}) {
      if (k === 'class') el.className = attrs[k];
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), attrs[k]);
      else el.setAttribute(k, attrs[k]);

    for (const kid of kids) if (kid != null && kid !== false) el.append(kid);

    return s;
  }
  const ICON_COPY = '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>';
  const ICON_OK = '<path d="M5 12l5 5L20 7"/>';
  const ICON_STAR = '<path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/>';

  let toastT;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1400);
  }

  function copy(text, codeEl, btn) {
    const ok = () => {
      toast('Skopiowano');
      if (btn) { btn.replaceChildren(svg(ICON_OK)); btn.classList.add('ok');
        setTimeout(() => { btn.replaceChildren(svg(ICON_COPY)); btn.classList.remove('ok'); }, 1200); }
    };
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents(codeEl);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      toast('Zaznaczono. Naciśnij Ctrl+C');
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  function norm(s) { return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l'); }
  function matches(q, ...parts) { return !q || q.split(/\s+/).every((w) => norm(parts.join(' ')).includes(w)); }

  function visibleSection(s) {
    if (state.d === 'cachy' || state.d === 'mint') return s.d === state.d || s.d === 'all';
    return true;
  }

  function renderItem(s, it, i) {
    const key = s.id + '|' + i;
    const children = [];
    if (s.kind === 'steps') {
      const isDone = state.done.has(key);
      children.push(h('button', {
        class: 'num', 'aria-pressed': String(isDone), title: isDone ? 'Oznacz jako niezrobione' : 'Oznacz jako zrobione',
        onclick: () => { isDone ? state.done.delete(key) : state.done.add(key); store.set('sciaga.done', [...state.done]); render(); },
      }, isDone ? '✓' : String(i + 1)));
    }
    let codeEl = null;
    const cmd = h('div', { class: 'cmd' });
    if (it.c) {
      codeEl = h('code', { title: 'Kliknij, żeby skopiować' }, it.c);
      cmd.append(codeEl);
    }
    if (it.g) cmd.append(h('div', { class: 'gui' + (it.c ? '' : ' solo') }, it.c ? 'GUI: ' : '', h('b', null, it.g)));
    children.push(cmd);
    children.push(h('div', { class: 'desc' }, h('p', null, it.x), it.w ? h('p', { class: 'warn' }, '⚠ ' + it.w) : null));

    const acts = h('div', { class: 'acts' });
    if (it.c) {
      const b = h('button', { class: 'ic', title: 'Kopiuj', 'aria-label': 'Kopiuj komendę' }, svg(ICON_COPY));
      b.addEventListener('click', () => copy(it.c, codeEl, b));
      codeEl.addEventListener('click', () => copy(it.c, codeEl, b));
      acts.append(b);
    }
    const fav = state.favs.has(key);
    const star = h('button', {
      class: 'ic' + (fav ? ' on' : ''), title: fav ? 'Usuń z ulubionych' : 'Dodaj do ulubionych', 'aria-pressed': String(fav),
      onclick: () => { fav ? state.favs.delete(key) : state.favs.add(key); store.set('sciaga.favs', [...state.favs]); render(); toast(fav ? 'Usunięto z ulubionych' : 'Dodano do ulubionych'); },
    }, svg(ICON_STAR));
    if (fav) star.querySelector('svg').setAttribute('fill', 'currentColor');
    acts.append(star);
    children.push(acts);
    return h('li', { class: 'item' + (s.kind === 'steps' && state.done.has(key) ? ' done' : '') }, ...children);
  }

  function render() {
    const q = norm(state.q.trim());
    const main = $('#main'); const chips = $('#chips');
    main.replaceChildren(); chips.replaceChildren();
    let shown = 0;

    for (const s of SECTIONS) {
      if (!visibleSection(s)) continue;
      const titleHit = q && matches(q, s.t, LABEL[s.d]);
      let body;
      if (s.kind === 'table') {
        if (state.d === 'fav') continue;
        const rows = s.rows.filter((r) => titleHit || matches(q, ...r));
        if (!rows.length) continue;
        body = h('div', { class: 'tbl' }, h('table', null,
          h('thead', null, h('tr', null, ...s.head.map((c) => h('th', null, c)))),
          h('tbody', null, ...rows.map((r) => h('tr', null, h('td', null, r[0]), h('td', { class: 'mono' }, r[1]), h('td', { class: 'mono' }, r[2]))))));
        shown += rows.length;
      } else {
        const items = s.items.map((it, i) => [it, i]).filter(([it, i]) =>
          (state.d !== 'fav' || state.favs.has(s.id + '|' + i)) && (titleHit || matches(q, it.c, it.x, it.w, it.g)));
        if (!items.length) continue;
        body = h('ol', { class: 'list' + (s.kind === 'steps' ? ' steps' : '') }, ...items.map(([it, i]) => renderItem(s, it, i)));
        shown += items.length;
      }
      let progress = null;
      if (s.kind === 'steps') {
        const n = s.items.filter((_, i) => state.done.has(s.id + '|' + i)).length;
        progress = h('span', { class: 'tag' }, n + ' / ' + s.items.length + ' zrobione');
      }
      main.append(h('section', { id: s.id },
        h('div', { class: 'sh' }, h('span', { class: 'tag ' + s.d }, LABEL[s.d]), h('h2', null, s.t), progress),
        s.intro && !q && state.d !== 'fav' ? h('p', { class: 'intro' }, s.intro) : null,
        body));
      chips.append(h('a', { href: '#' + s.id }, h('span', { class: 'dot ' + s.d }), s.t));
    }

    if (!shown) {
      main.append(h('div', { class: 'empty' },
        state.d === 'fav' && !q
          ? h('p', null, 'Nie masz jeszcze ulubionych. Kliknij ', h('b', null, '☆'), ' przy komendzie, żeby ją tu dodać.')
          : h('p', null, 'Nic nie pasuje do „', h('b', null, state.q), '”. Spróbuj innego słowa albo przełącz na ', h('b', null, 'Wszystko'), '.')));
    }
    chips.hidden = !shown;
    document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.d === state.d)));
  }

  document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => {
    state.d = b.dataset.d; store.set('sciaga.d', state.d); render(); window.scrollTo({ top: 0 });
  }));
  $('#q').addEventListener('input', (e) => { state.q = e.target.value; render(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }
    if (e.key === 'Escape' && document.activeElement === $('#q')) { $('#q').value = ''; state.q = ''; render(); }
  });

  // PWA: instalacja i praca offline (nie działa w podglądzie Artifact, tam po cichu pomijamy)
  let deferred = null;
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; $('#installBtn').hidden = false; });
  $('#installBtn').addEventListener('click', async () => {
    if (!deferred) return; deferred.prompt(); await deferred.userChoice.catch(() => {}); deferred = null; $('#installBtn').hidden = true;
  });
  if (!window.__ARTIFACT && 'serviceWorker' in navigator && location.protocol !== 'file:') {
    try { navigator.serviceWorker.register('./sw.js').catch(() => {}); } catch (e) {}
  }

  render();
})();

</script>
</body>
</html>
